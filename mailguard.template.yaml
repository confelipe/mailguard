apiVersion: v1
kind: ServiceAccount
metadata:
  name: mailguard-sa
  namespace: ${NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mailguard-configmap-role
  namespace: ${NAMESPACE}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["mailguard-allowed-ips"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mailguard-configmap-rb
  namespace: ${NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: mailguard-sa
    namespace: ${NAMESPACE}
roleRef:
  kind: Role
  name: mailguard-configmap-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-mailguard
  namespace: ${NAMESPACE}
spec:
  secretName: tls-mailguard
  commonName: ${MYHOSTNAME}
  subject:
    organizations:
      - Infrastructure
    organizationalUnits:
      - K8S
    countries:
      - BR
  dnsNames:
    - ${MYHOSTNAME}
    - mailguard
    - mailguard.${NAMESPACE}
    - mailguard.${NAMESPACE}.svc.cluster.local
  issuerRef:
    kind: ClusterIssuer
    name: ${CLUSTER_ISSUER}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mailguard-config
  namespace: ${NAMESPACE}
data:
  TZ: "${TZ}"
  MYHOSTNAME: "${MYHOSTNAME}"
  SMTP_RELAY_HOST: "${SMTP_RELAY_HOST}"
  GRAYLOG_HOST: "${GRAYLOG_HOST}"
  GRAYLOG_PORT: "${GRAYLOG_PORT}"
  WAZUH_HOST: "${WAZUH_HOST}"
  WAZUH_PORT: "${WAZUH_PORT}"
  DASHBOARD_PORT: "${DASHBOARD_PORT}"
  DASHBOARD_USER: "${DASHBOARD_USER}"
  DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mailguard-allowed-ips
  namespace: ${NAMESPACE}
data:
  allowed_ips.cidr: |
    # ==============================================================================
    # Tabela de IPs / Redes Autorizadas para Relay no MailGuard
    # Formato: <IP_OU_CIDR>    OK # <Descricao_Opcional>
    # ==============================================================================

    # Loopback & Redes Internas do Cluster
    127.0.0.0/8            OK # Localhost
    10.0.0.0/8             OK # Rede Interna do Cluster
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailguard
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailguard
  template:
    metadata:
      labels:
        app: mailguard
    spec:
      serviceAccountName: mailguard-sa
      containers:
        - name: mailguard
          image: ${IMAGE_TAG}
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 350m
              memory: 384Mi
            requests:
              cpu: 50m
              memory: 64Mi
          ports:
            - name: smtp
              containerPort: 25
            - name: submission
              containerPort: 587
            - name: https
              containerPort: 443
          envFrom:
            - configMapRef:
                name: mailguard-config
          volumeMounts:
            - name: tls-cert
              mountPath: /etc/ssl/mailguard
              readOnly: true
            - name: allowed-ips
              mountPath: /etc/mailguard/configmap
              readOnly: true
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "kill -0 1"
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "kill -0 1"
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: tls-cert
          secret:
            secretName: tls-mailguard
            defaultMode: 0400
            optional: true
        - name: allowed-ips
          configMap:
            name: mailguard-allowed-ips
            defaultMode: 0400
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: mailguard
  namespace: ${NAMESPACE}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: mailguard
  ports:
    - name: smtp
      protocol: TCP
      port: 25
      targetPort: 25
    - name: submission
      protocol: TCP
      port: 587
      targetPort: 587
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
